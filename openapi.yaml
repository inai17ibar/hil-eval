components:
  schemas:
    AssetRole:
      enum:
      - input
      - output
      - context
      title: AssetRole
      type: string
    AssetUpload:
      properties:
        bbox:
          anyOf:
          - items:
              type: number
            type: array
          - type: 'null'
          title: Bbox
        data_base64:
          title: Data Base64
          type: string
        filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Filename
        mime:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime
        role:
          $ref: '#/components/schemas/AssetRole'
          default: input
        video_ts:
          anyOf:
          - minimum: 0.0
            type: number
          - type: 'null'
          title: Video Ts
      required:
      - data_base64
      title: AssetUpload
      type: object
    CreateItemRequest:
      properties:
        assets:
          anyOf:
          - items:
              $ref: '#/components/schemas/AssetUpload'
            type: array
          - type: 'null'
          title: Assets
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        fn_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Fn Name
        input:
          title: Input
        judge_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Judge Label
        judge_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Judge Reason
        options:
          anyOf:
          - items: {}
            type: array
          - type: 'null'
          title: Options
        output:
          title: Output
        project:
          title: Project
          type: string
        tags:
          anyOf:
          - additionalProperties:
              type: string
            type: object
          - type: 'null'
          title: Tags
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
      required:
      - project
      - input
      - output
      title: CreateItemRequest
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ReasonCodeRequest:
      properties:
        code:
          title: Code
          type: string
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        polarity:
          anyOf:
          - type: string
          - type: 'null'
          title: Polarity
      required:
      - code
      title: ReasonCodeRequest
      type: object
    ReviewAction:
      enum:
      - approve
      - edit
      - reject
      - skip
      - choose
      title: ReviewAction
      type: string
    ReviewRequest:
      properties:
        action:
          $ref: '#/components/schemas/ReviewAction'
        choice:
          title: Choice
        corrected_output:
          title: Corrected Output
        judge_correct:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Judge Correct
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        reason_codes:
          items:
            type: string
          title: Reason Codes
          type: array
        reason_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason Text
        reviewer:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewer
      required:
      - action
      title: ReviewRequest
      type: object
    Status:
      enum:
      - pending
      - approved
      - corrected
      - rejected
      - skipped
      - superseded
      title: Status
      type: string
    SupersedeRequest:
      properties:
        project:
          title: Project
          type: string
        tag_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Key
        tag_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag Value
        trace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Trace Id
      required:
      - project
      title: SupersedeRequest
      type: object
    TagThresholdRequest:
      properties:
        tag_key:
          title: Tag Key
          type: string
        tag_value:
          title: Tag Value
          type: string
        threshold:
          title: Threshold
          type: number
      required:
      - tag_key
      - tag_value
      - threshold
      title: TagThresholdRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: hil-eval
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Healthz
  /v1/blobs/{sha256}:
    get:
      operationId: get_blob_v1_blobs__sha256__get
      parameters:
      - in: path
        name: sha256
        required: true
        schema:
          title: Sha256
          type: string
      - in: query
        name: api_key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Blob
  /v1/items:
    get:
      operationId: list_items_v1_items_get
      parameters:
      - in: query
        name: project
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/Status'
            type: array
          - type: 'null'
          title: Status
      - in: query
        name: min_confidence
        required: false
        schema:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Min Confidence
      - in: query
        name: max_confidence
        required: false
        schema:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Max Confidence
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: include_expired
        required: false
        schema:
          default: false
          title: Include Expired
          type: boolean
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Items
    post:
      operationId: create_item_v1_items_post
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Item
  /v1/items/supersede:
    post:
      operationId: supersede_v1_items_supersede_post
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupersedeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Supersede
  /v1/items/{item_id}:
    delete:
      operationId: delete_item_v1_items__item_id__delete
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Item
    get:
      operationId: get_item_v1_items__item_id__get
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Item
  /v1/items/{item_id}/review:
    post:
      operationId: review_item_v1_items__item_id__review_post
      parameters:
      - in: path
        name: item_id
        required: true
