info:
  title: hil-eval
  version: 0.1.0
openapi: 3.1.0
paths:
  /healthz:
    get:
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Healthz
  /v1/blobs/{sha256}:
    get:
      operationId: get_blob_v1_blobs__sha256__get
      parameters:
      - in: path
        name: sha256
        required: true
        schema:
          title: Sha256
          type: string
      - in: query
        name: api_key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Api Key
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Blob
  /v1/items:
    get:
      operationId: list_items_v1_items_get
      parameters:
      - in: query
        name: project
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Project
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - items:
              $ref: '#/components/schemas/Status'
            type: array
          - type: 'null'
          title: Status
      - in: query
        name: min_confidence
        required: false
        schema:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Min Confidence
      - in: query
        name: max_confidence
        required: false
        schema:
          anyOf:
          - maximum: 1.0
            minimum: 0.0
            type: number
          - type: 'null'
          title: Max Confidence
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: include_expired
        required: false
        schema:
          default: false
          title: Include Expired
          type: boolean
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Items
    post:
      operationId: create_item_v1_items_post
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Item
  /v1/items/supersede:
    post:
      operationId: supersede_v1_items_supersede_post
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupersedeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupersedeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Supersede
  /v1/items/{item_id}:
    delete:
      operationId: delete_item_v1_items__item_id__delete
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Item
    get:
      operationId: get_item_v1_items__item_id__get
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Item
  /v1/items/{item_id}/review:
    post:
      operationId: review_item_v1_items__item_id__review_post
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          title: Item Id
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Review Item
  /v1/projects:
    get:
      operationId: list_projects_v1_projects_get
      parameters:
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ProjectResponse'
                title: Response List Projects V1 Projects Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Projects
  /v1/projects/{project}/reason-codes:
    get:
      operationId: reason_codes_v1_projects__project__reason_codes_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ReasonCodeResponse'
                title: Response Reason Codes V1 Projects  Project  Reason Codes Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Reason Codes
    post:
      operationId: register_reason_v1_projects__project__reason_codes_post
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCodeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReasonCodeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Register Reason
  /v1/projects/{project}/threshold:
    get:
      operationId: get_threshold_v1_projects__project__threshold_get
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - in: query
        name: tag
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tag
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Threshold
    put:
      operationId: set_threshold_v1_projects__project__threshold_put
      parameters:
      - in: path
        name: project
        required: true
        schema:
          title: Project
          type: string
      - in: header
        name: x-api-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        content:
          application/json:
            schema:
